<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طباعة أوراق الأمر</title>
<style>
@page{size:A4 landscape;margin:8mm}
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#edf2f7;color:#172b4d}
#ui{background:#fff;padding:20px;max-width:900px;margin:18px auto;border:1px solid #d7e0ea;border-radius:14px;box-shadow:0 8px 26px #17365d18}
#ui h3{margin:0 0 16px;padding:14px 16px;background:linear-gradient(110deg,#123b5d,#176b70);color:#fff;border-radius:10px}
#ui label{display:inline-block;margin:7px 10px;font-weight:600;color:#28445e}
#ui input,#ui select{padding:9px;width:170px;border:1px solid #bdcbd8;border-radius:7px;background:#fbfdff;color:#172b4d}
#ui input:focus,#ui select:focus{outline:2px solid #5bb8b0;border-color:#258b86}
#ui button{border:0;border-radius:8px;background:#176b70;color:#fff;font-weight:bold;padding:10px 18px;box-shadow:0 3px 8px #123b5d20}
#ui button:hover{background:#123b5d}
#err{padding:6px 0}
#ui label{display:inline-block;margin:4px 10px}
#ui input,#ui select{padding:4px;width:150px}
#codes div{margin:3px 0}#codes input{width:110px;text-align:center}
button{padding:7px 16px;margin:6px;font-size:15px;cursor:pointer}
#err{color:#c00;font-weight:bold}
.page{background:#fff;width:281mm;height:193mm;margin:10px auto;padding:2mm;border:1px solid #cbd5df;box-shadow:0 5px 20px #17365d18;page-break-after:always;overflow:hidden}
.page:last-child{page-break-after:auto}
.hd{display:flex;justify-content:space-between;font-weight:bold;font-size:14pt;margin:0 0 3mm}
table{border-collapse:collapse;width:100%}
.t{direction:ltr;table-layout:fixed}
.t td,.t th{border:1px solid #9aaebe;text-align:center;font-size:10pt;padding:1px}
.t th{background:#dce8f2;color:#173b5e;height:13mm;font-size:9.5pt}
.t th.c{background:#d8eee8}.t th.s{background:#e8e5f5}
.t td{height:14.5mm;font-weight:bold;background:#fff}
.t td.n{background:#e5edf4;color:#173b5e;font-size:10pt;width:7mm}
.g{color:#087f5b;display:block}.red{color:#b42318;font-size:10.5pt;line-height:1.1;font-weight:bold}
.gr{background:#edf3f8}
.ft{display:flex;justify-content:space-between;font-size:17pt;font-weight:bold;margin-top:5mm}
.cv{direction:rtl;table-layout:fixed}
.cv td{border:1px solid #9aaebe;text-align:center;height:13mm;font-size:13pt}
.cv .b{background:#176b70;color:#fff;font-weight:bold}.cv .l{background:#e5f0f4}
.cv td:first-child{font-weight:bold}.cv .h td{background:#123b5d;color:#fff;height:22mm}
@media print{html,body{background:#fff!important;color:#000!important;margin:0!important;padding:0!important}#ui{display:none!important}#out{display:block!important}.page{width:281mm;height:193mm;margin:0;padding:2mm;border:0;box-shadow:none;break-after:page;page-break-after:always;overflow:hidden}.page:last-child{break-after:auto;page-break-after:auto}.t th,.t td,.cv td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="ui">
<h3>طباعة أوراق الأمر (تسجيل العربات / طاقم الماكينة)</h3>
<label>رقم الأمر <input id="order" value="1/6029"></label>
<label>الفئة <input id="denom" value="50 جنيه"></label>
<label>رقم البداية (من الغلاف) <input id="start" value="8892480"></label>
<label>إجمالي الأفرخ (حد أقصى 1,200,000) <input id="total" value="1200000"></label>
<label>المطبوع سابقًا من السريال الأول <input id="used" type="number" min="0" max="277777" value="0"></label>
<label>أول سريال <input id="first" value="495"></label>
<label>تخطي مضاعفات <input id="step" value="100"></label>
<label>الملف <select id="kind"><option value="carts">تسجيل العربات</option><option value="crew">طاقم الماكينة</option><option value="both">الاثنان</option></select></label>
<div><button onclick="calc()">حساب السريالات</button></div>
<div id="err"></div><div id="codes"></div>
<button id="pb" onclick="showPages()" style="display:none">عرض الأوراق</button>
<button id="pr" onclick="printPages()" style="display:none">طباعة</button>
</div>
<div id="out"></div>
<script>
const N=36,SS=Math.ceil(1e7/N),CS=1e4,CAP=1.2e6,STRIKE=SS*N-1e7+1;
const $=id=>document.getElementById(id);
const fmt=n=>{const s=String(n).padStart(7,'0');return s.length>7?n.toLocaleString('en-US'):s[0]+','+s.slice(1,4)+','+s.slice(4)};
function firstSheet(s){
  if(s<CS)throw'رقم البداية غير صالح';
  const cn=CS*N,q=Math.floor((s-CS)/cn),rem=(s-CS)-q*cn;
  if(rem%(N-1))throw'رقم البداية لا يطابق نظام ترقيم العربات';
  const r=rem/(N-1);if(r>=CS)throw'رقم البداية غير صالح';
  const f=q*CS+r+1;if(f>SS)throw'رقم البداية خارج نطاق السريال';return f}
function plan(start,total,first,step,used=0){
  if(!(total>=1))throw'الكمية غير صالحة';
  if(total>CAP)throw'إجمالي الكمية ('+total.toLocaleString('en-US')+') يتجاوز الحد الأقصى 1,200,000 فرخ';
  let f=used>0?used+1:firstSheet(start),left=total,s=first,pages=[];
  if(used<0||used>=SS)throw'الكمية المطبوعة سابقًا يجب أن تكون بين 0 و277777 فرخ';
  if(used>0 && start<CS)throw'أدخل رقم بداية السريال الصحيح من الغلاف';
  while(left>0){
    while(step>0&&s%step==0)s++;
    const n=Math.min(left,SS-f+1);
    pages.push({serial:s,first:f,last:f+n-1,qty:n});left-=n;f=1;s++}
  return pages}
function carts(first,last){
  const o={};
  for(let c=1;c<=28;c++){
    const lo=Math.max(first,(c-1)*CS+1),hi=Math.min(last,c*CS,SS);
    if(lo>hi)continue;
    const m=hi-lo+1,b=(lo-1)*N;o[c]={m,top:b+m,bottom:b+1+(N-1)*m}}
  return o}
let pages=[];
function calc(){
  $('err').textContent='';
  try{
    pages=plan(+$('start').value.replace(/,/g,''),+$('total').value.replace(/,/g,''),+$('first').value,+$('step').value,+$('used').value);
  }catch(e){pages=[];$('err').style.color='#b42318';$('err').textContent=e;$('codes').innerHTML='';$('pb').style.display=$('pr').style.display='none';return}
  const old=[...document.querySelectorAll('#codes input')].map(i=>i.value),d=new Date();
  const def=d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
  if(+$('used').value>0){
    $('err').style.color='#176b70';
    $('err').textContent='سيتم استكمال السريال الأول من الفرخ '+(+$('used').value+1).toLocaleString('en-US')+'، والمتبقي فيه '+(SS-+$('used').value).toLocaleString('en-US')+' فرخ.';
  } else {$('err').textContent='';$('err').style.color='';}
  $('codes').innerHTML=pages.map((p,i)=>`<div>سريال هـ \\ ${p.serial} — ${p.qty.toLocaleString('en-US')} فرخ — الكودي: <input value="${old[i]||def}"></div>`).join('')
    +`<div><b>الإجمالي: ${pages.reduce((a,p)=>a+p.qty,0).toLocaleString('en-US')} فرخ — ${pages.length} صفحة</b></div>`;
  $('pb').style.display=$('pr').style.display='inline-block'}
function cover(crew,c0,order,denom){
  const pile=c0.m,st=c0.top;let g='';
  for(let r=0;r<9;r++){g+='<tr>';for(let c=0;c<4;c++)g+=`<td class="${c==0?'b':'l'}">${st+pile*(r*4+c)}</td>`;g+='</tr>'}
  return `<div class="page"><table class="cv"><tr class="h"><td>الامر رقم</td><td>${order}</td><td>فئة</td><td>${denom}</td></tr>
  <tr><td class="b">البداية</td><td class="l">${st.toLocaleString('en-US')}</td><td class="l">عدد الافرخ</td><td class="l">${pile}</td></tr>${g}
  ${crew?`<tr><td class="b">البداية للالة</td><td class="l">${st}</td><td class="l">النهاية للالة</td><td class="l">${c0.bottom}</td></tr>`:''}</table></div>`}
function slot(c,cs,L,last,crew,end){
  if(!c)return '<td></td><td></td><td></td><td></td><td></td>';
  const blank='<td></td><td></td>';
  if(end&&c==L+1)return blank+`<td colspan="3" class="red">نهاية الأمر<br>${(last*N).toLocaleString('en-US')}</td>`;
  const i=cs[c];
  if(!i)return blank+'<td></td><td></td><td></td>';
  const lab=i.m<CS?`<td class="red">${i.m}<br>فرخ<br>معيب</td>`:'<td></td>';
  return blank+lab+`<td><span class="g">${fmt(i.top)}</span>${fmt(i.bottom)}</td><td class="n">${c}</td>`}
function sheet(p,code,order,denom,crew,isLast){
  const cs=carts(p.first,p.last),L=Math.max(...Object.keys(cs).map(Number)),done=p.last==SS;
  const h2=crew?'<th class="c">تسليم</th><th class="c">طباعة</th>':'<th class="c" colspan="2">عربة</th>';
  const hg=h2+'<th class="s">سليم \\ معيب</th><th>التغييرة</th><th>ط</th>';
  let rows='';
  for(let r=1;r<=10;r++){
    const a=r==10?28:18+r,b=r<=9?9+r:0,c=r<=9?r:0;
    rows+='<tr>'+slot(a,cs,L,p.last,crew,isLast)+(r<=9?slot(b,cs,L,p.last,crew,isLast)+slot(c,cs,L,p.last,crew,isLast):'')+'</tr>'}
  let note=done?`* يتم شطب عدد ${STRIKE} وحدات`:'';
  if(isLast&&L==28)note=`نهاية الأمر ${(p.last*N).toLocaleString('en-US')}`;
  return `<div class="page"><div class="hd"><span>السريال :- هـ \\ ${p.serial}</span><span>الكودي: - ${code}</span><span>رقم الأمر: - ${order}</span><span>الفئة: - ${denom}</span></div>
  <table class="t"><colgroup>${'<col><col><col><col style="width:27mm"><col style="width:8mm">'.repeat(3)}</colgroup>
  <tr>${hg}${hg}${hg}</tr>${rows}</table>
  <div class="ft"><span>الكمية المطبوعة من السريال: ${p.qty.toLocaleString('en-US')}</span><span>${crew?'طاقم الماكينة':'تسجيل العربات'}</span><span class="red" style="font-size:17pt">${note}</span></div></div>`}
function build(){
  calc();if(!pages.length)return false;
  const codes=[...document.querySelectorAll('#codes input')].map(i=>i.value.trim());
  if(codes.length!==pages.length||codes.some(c=>!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c))){$('err').style.color='#b42318';$('err').textContent='صيغة الكودي يجب أن تكون مثل 22/9/2026';return false}
  const order=$('order').value.trim(),denom=$('denom').value.trim(),k=$('kind').value;
  const c0=carts(pages[0].first,pages[0].last);const c00=c0[Math.min(...Object.keys(c0).map(Number))];
  if(!c00){$('err').style.color='#b42318';$('err').textContent='تعذر تكوين الغلاف؛ راجع رقم البداية والكمية.';return false}
  let h='';
  for(const crew of k=='both'?[false,true]:[k=='crew']){
    h+=cover(crew,c00,order,denom);
    pages.forEach((p,i)=>h+=sheet(p,codes[i],order,denom,crew,i==pages.length-1))}
  $('out').innerHTML=h;
  return true;
}
function showPages(){
  if(build()) $('out').scrollIntoView({behavior:'smooth',block:'start'});
}
function printPages(){
  if(!build())return;
  $('out').scrollIntoView({block:'start'});
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));
}
calc();
</script>
</body>
</html>
